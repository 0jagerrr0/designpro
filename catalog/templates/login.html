{% extends 'base.html' %}
{% block title %}Вход — Design.pro{% endblock %}
{% block content %}

<div class="card">
    <h2>Вход в аккаунт</h2>

    <form method="post">
        {% if error %}
            <p class="errorlist">{{ error }}</p>
        {% endif %}

        {% csrf_token %}

        <p>
            <label for="username">Логин:</label>
            <input
                type="text"
                name="username"
                id="username"
                required
                {% if error %}class="input-error"{% endif %}
            >
        </p>

        <p>
            <label for="password">Пароль:</label>
            <input
                type="password"
                name="password"
                id="password"
                required
                {% if error %}class="input-error"{% endif %}
            >
        </p>

        <button type="submit">Войти</button>
    </form>

    <p>
        Нет аккаунта?
        <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>
</div>

{% endblock %}
